<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Criação de Chinchilas</title>
    <link rel="stylesheet" href="css/bootstrap.min.css"> 
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1>Programa Criação de Chinchilas</h1>
                <hr>
                <img src="imagens/exerc.jpg" width="220">
                <form action="">
                <p>N° de Chinchilas: <input type="number" id="inChinchilas" min="0" step="0.01" required></p>
                <p>N° Anos: <input type="number" id="inAnos" min="0" step="0.01" required></p> 
                <input type="submit" value="Mostrar Previsão de Chinchilas" class="btn btn-success">
                </form>
                <h3></h3>
            </div>
        </div>
    </div>
    <script src="js/ex2.js"></script>
</body>
</html>
