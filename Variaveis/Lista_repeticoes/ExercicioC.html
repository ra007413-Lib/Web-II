<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Números Perfeitos</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1>Programa Números Perfeitos</h1>
                <hr>
                <img src="imagens/exerc.jpg" width="220">
                <form action="">
                    <p>Número: <input type="number" id="inNumero" min="0" step="0.01" required></p>
                    <input type="submit" value="Verificar se é Perfeito" class="btn btn-success">
                </form>
                <h3></h3>
            </div>
        </div>
    </div>
    <script src="js/ex3.js"></script>
</body>
</html>
