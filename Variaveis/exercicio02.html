<script>
    let valorConta = Number(prompt("Digite o valor da conta:"))
    let clientes = Number(prompt("Digite o número de clientes:"))
    let valorPorCliente = valorConta / clientes
    
    alert("Valor da conta: R$" + valorConta.toFixed(2) + "\nNumero de Clientes:" + clientes + "\nValor por Cliente: R$" + valorPorCliente.toFixed(2))
</script>
